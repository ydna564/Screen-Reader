<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="lead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#98a2ae"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0b1f2a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="880" height="392" rx="14" fill="#eef1f4"/>
  <text x="28" y="38" font-size="13" fill="#5b6673" letter-spacing="0.6">WHAT APPEARS ON SCREEN AFTER YOU LET GO</text>

  <!-- dimmed screen area -->
  <rect x="28" y="56" width="470" height="300" rx="10" fill="#243542"/>

  <!-- the selected region, undimmed, with the yellow frame -->
  <rect x="70" y="112" width="290" height="150" rx="4" fill="#f7f7f4"/>
  <rect x="70" y="112" width="290" height="150" rx="4" fill="none" stroke="#f2c14e" stroke-width="3"/>
  <text x="92" y="152" font-size="15" fill="#2b3542">这是一个屏幕翻译工具</text>
  <text x="92" y="182" font-size="12.5" fill="#6b7683">the region you dragged over</text>
  <text x="92" y="210" font-size="12.5" fill="#6b7683">stays highlighted and readable</text>

  <!-- cancel button below the selection -->
  <g filter="url(#sh)">
    <rect x="146" y="278" width="140" height="30" rx="7" fill="#f3f4f6" stroke="#c9ced6"/>
  </g>
  <text x="216" y="298" font-size="12.5" fill="#b3261e" text-anchor="middle">✕ Cancel translation</text>

  <!-- result panel beside the selection -->
  <g filter="url(#sh)">
    <rect x="530" y="96" width="322" height="182" rx="11" fill="#1b1c1f"/>
  </g>
  <text x="552" y="126" font-size="11.5" fill="#ffffff" opacity="0.6" font-weight="600">Chinese (Mandarin) to English</text>
  <rect x="754" y="110" width="76" height="22" rx="6" fill="#ffffff" opacity="0.16"/>
  <text x="792" y="126" font-size="11.5" fill="#ffffff" text-anchor="middle">⧉ Copy</text>
  <text x="552" y="164" font-size="15" fill="#ffffff">This is a screen translation tool</text>
  <text x="552" y="200" font-size="12" fill="#ffffff" opacity="0.45">the header names what happened, so a</text>
  <text x="552" y="220" font-size="12" fill="#ffffff" opacity="0.45">skipped translation is never mistaken</text>
  <text x="552" y="240" font-size="12" fill="#ffffff" opacity="0.45">for a failed one</text>

  <!-- leader lines -->
  <line x1="366" y1="140" x2="524" y2="122" stroke="#98a2ae" stroke-width="1.4" marker-end="url(#lead)"/>
  <line x1="292" y1="293" x2="330" y2="293" stroke="#98a2ae" stroke-width="1.4" marker-end="url(#lead)"/>
  <text x="338" y="297" font-size="11.5" fill="#5b6673">dismisses everything</text>

  <!-- state legend -->
  <text x="530" y="312" font-size="11.5" fill="#5b6673" letter-spacing="0.5">MENU BAR ICON STATE</text>
  <g font-size="12">
    <text x="530" y="336" fill="#1E4A5F" font-weight="600">+</text><text x="552" y="336" fill="#5b6673">selecting</text>
    <text x="640" y="336" fill="#1E4A5F" font-weight="600">…</text><text x="662" y="336" fill="#5b6673">recognising</text>
    <text x="770" y="336" fill="#1E4A5F" font-weight="600">↓</text><text x="792" y="336" fill="#5b6673">pack</text>
    <text x="530" y="358" fill="#1E4A5F" font-weight="600">♪</text><text x="552" y="358" fill="#5b6673">speaking</text>
    <text x="640" y="358" fill="#1E4A5F" font-weight="600">•</text><text x="662" y="358" fill="#5b6673">overlay pinned</text>
  </g>

  <text x="48" y="378" font-size="11.5" fill="#8a94a2">Press ⇧⌘1 again, or Esc while selecting, to clear the overlay.</text>
</svg>
